name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user

            if [ ! -d "aiproject" ]; then
              git clone https://github.com/Yogiram05/aiproject.git
            fi

            cd aiproject
            git pull

            echo "Deployment Success"
