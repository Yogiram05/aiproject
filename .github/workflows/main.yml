name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          cd aiproject || git clone https://github.com/Yogiram05/aiproject.git
          cd aiproject
          git pull origin main

          python3 -m venv venv
          source venv/bin/activate

          pip install --upgrade pip

          nohup python3 main.py > output.log 2>&1 &
